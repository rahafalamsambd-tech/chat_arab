<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات عربي - الدردشة العامة</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-bottom: 10px; }
        #chat-container { flex: 1; background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #e3f2fd; padding: 10px; border-radius: 8px; max-width: 75%; word-break: break-word; }
        .message span { display: block; font-weight: bold; font-size: 12px; color: #555; margin-bottom: 3px; }
        #input-container { display: flex; gap: 10px; }
        #username { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 25%; }
        #message-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #006dd9; }
    </style>
</head>
<body>

    <h2>💬 الشات العربي العام</h2>

    <div id="chat-container">
        <!-- ستظهر الرسائل هنا تلقائياً -->
    </div>

    <div id="input-container">
        <input type="text" id="username" placeholder="اسمك..." required>
        <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." required>
        <button id="send-btn">إرسال</button>
    </div>

    <!-- ربط مكتبة فايربيس (Firebase) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // سنقوم بوضع بيانات قاعدة البيانات هنا لاحقاً
        const firebaseConfig = {
            // سنضعها في الخطوة القادمة
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const chatContainer = document.getElementById('chat-container');
        const usernameInput = document.getElementById('username');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        sendBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const text = messageInput.value.trim();
            if(username && text) {
                const messagesRef = ref(db, 'messages');
                push(messagesRef, {
                    username: username,
                    text: text,
                    timestamp: Date.now()
                });
                messageInput.value = '';
            }
        });

        const messagesRef = ref(db, 'messages');
        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<span>${msg.username}</span>${msg.text}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>
</html>
