<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات العرب المتطور</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 5px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        .chat-container { width: 100%; max-width: 500px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 95vh; }
        .chat-header { background: #0084ff; color: white; padding: 10px 12px; text-align: center; font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .calls-group { display: flex; gap: 5px; }
        .voice-call-btn { background: #17a2b8; color: white; border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .video-call-btn { background: #28a745; color: white; border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #e4e6eb; display: flex; flex-direction: column; gap: 10px; }
        .message { background: white; padding: 10px; border-radius: 8px; max-width: 75%; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message.sent { align-self: flex-start; background: #dcf8c6; }
        .message img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
        .chat-input { display: flex; padding: 8px; background: white; border-top: 1px solid #ddd; gap: 5px; align-items: center; box-sizing: border-box; width: 100%; }
        .chat-input input[type="text"] { flex: 1; padding: 9px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 14px; min-width: 0; }
        .chat-input input[type="file"] { display: none; }
        .action-btn { background: #f0f2f5; border: none; padding: 8px; border-radius: 50%; cursor: pointer; font-size: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .send-btn { background: #0084ff; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>💬 شات العرب</span>
        <div class="calls-group">
            <button class="voice-call-btn" onclick="startCall(true)">📞 اتصال صوتي</button>
            <button class="video-call-btn" onclick="startCall(false)">📹 مكالمة فيديو</button>
        </div>
    </div>

    <div class="chat-messages" id="messageBox"></div>

    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="اكتب رسالتك..." onkeypress="checkEnter(event)">
        
        <!-- زر رفع الصور -->
        <label for="imageInput" class="action-btn" title="إرسال صورة">📷</label>
        <input type="file" id="imageInput" accept="image/*" onchange="sendImage(event)">

        <!-- زر تسجيل الصوت -->
        <button id="recordBtn" class="action-btn" onclick="toggleRecord()" title="تسجيل صوت">🎤</button>

        <!-- زر الإرسال -->
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    let messages = JSON.parse(localStorage.getItem('chat_messages')) || [];

    function displayMessages() {
        const box = document.getElementById('messageBox');
        box.innerHTML = '';
        messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'message sent';
            div.innerHTML = `<strong>رهف:</strong> ${msg.content}`;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        if (!input.value.trim()) return;

        messages.push({ content: input.value });
        localStorage.setItem('chat_messages', JSON.stringify(messages));
        input.value = '';
        displayMessages();
    }

    function checkEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function sendImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const imgHtml = `<br><img src="${e.target.result}">`;
            messages.push({ content: imgHtml });
            localStorage.setItem('chat_messages', JSON.stringify(messages));
            displayMessages();
        };
        reader.readAsDataURL(file);
    }

    // دالة لبدء المكالمة (سواء صوتي بحت أو فيديو، مع إمكانية فتح الكاميرا وإغلاقها داخل المكالمة)
    function startCall(audioOnly) {
        const roomName = "ChatArabRoom_" + Math.random().toString(36).substring(7);
        // إذا كان صوتياً، نضبط الكاميرا لتكون مغلقة عند البدء، وسيقدم لك النظام خيار فتحها لاحقاً داخل شاشة المكالمة
        const configParam = audioOnly ? '#config.startWithVideoMuted=true' : '';
        window.open(`https://meet.jit.si/${roomName}${configParam}`, '_blank');
    }

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    async function toggleRecord() {
        const btn = document.getElementById('recordBtn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audioHtml = `<br><audio controls src="${audioUrl}"></audio>`;
                    messages.push({ content: audioHtml });
                    localStorage.setItem('chat_messages', JSON.stringify(messages));
                    displayMessages();
                };
                mediaRecorder.start();
                isRecording = true;
                btn.style.background = '#ff4d4d';
            } catch (err) {
                alert("لا يمكن الوصول للميكروفون.");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.style.background = '#f0f2f5';
        }
    }

    displayMessages();
</script>

</body>
</html>
